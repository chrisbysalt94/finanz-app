<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <title>Finanz App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007aff'/><text x='50' y='68' font-size='52' font-weight='bold' text-anchor='middle' fill='white'>€</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Finanz App</h1>
    </header>

    <main class="app-main">
      <component :is="currentView" :data="budgetData" @refresh="loadData"></component>
    </main>

    <nav class="bottom-nav">
      <button :class="{ active: currentTab === 'dashboard' }" @click="currentTab = 'dashboard'">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Budget</span>
      </button>
      <button :class="{ active: currentTab === 'transfers' }" @click="currentTab = 'transfers'">
        <span class="nav-icon">💸</span>
        <span class="nav-label">Überweisungen</span>
      </button>
      <button :class="{ active: currentTab === 'standing-orders' }" @click="currentTab = 'standing-orders'">
        <span class="nav-icon">🔄</span>
        <span class="nav-label">Daueraufträge</span>
      </button>
      <button :class="{ active: currentTab === 'settings' }" @click="currentTab = 'settings'">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Einstellungen</span>
      </button>
    </nav>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="views/Dashboard.js"></script>
  <script src="views/Transfers.js"></script>
  <script src="views/StandingOrders.js"></script>
  <script src="views/Settings.js"></script>
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
